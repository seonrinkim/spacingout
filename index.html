<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>spacing out</title>
  </head>
  <body>
    <!-- 1. 검은 배경 (+ useBaseVideo 일 때만 배경 영상) -->
    <video id="bg" muted autoplay loop playsinline preload="none"></video>
    <!-- 2. 숫자 실루엣 (WebGL) -->
    <canvas id="silhouette"></canvas>
    <!-- 3. 프로브 레이어 -->
    <div id="probe-layer"></div>
    <!-- 4. 타임코드 레이어 -->
    <div id="timecode-layer"></div>
    <!-- 디버그 전용 표시 -->
    <div id="markers" hidden></div>
    <div id="probe-marker" hidden></div>
    <!-- 카메라 입력(보이지 않음, 저장/전송하지 않음) -->
    <video id="cam" muted playsinline></video>
    <!-- 5. 디버그 오버레이 -->
    <div id="debug" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
